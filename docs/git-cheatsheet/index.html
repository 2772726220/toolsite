<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var gitResult = document.getElementById('gitResult');
  var GIT = [
    ['配置', [
      ['git config --global user.name "名字"', '设置用户名'],
      ['git config --global user.email "邮箱"', '设置邮箱'],
      ['git config --list', '查看所有配置'],
      ['git config --global core.editor "vim"', '设置默认编辑器'],
      ['git config --global color.ui true', '开启颜色显示']
    ]],
    ['初始化/克隆', [
      ['git init', '初始化新仓库'],
      ['git clone <仓库地址>', '克隆远程仓库'],
      ['git clone <地址> <目录>', '克隆到指定目录']
    ]],
    ['提交', [
      ['git status', '查看工作区状态'],
      ['git add <文件>', '暂存单个文件'],
      ['git add .', '暂存所有修改'],
      ['git commit -m "说明"', '提交暂存内容'],
      ['git commit -am "说明"', '暂存并提交（跳过已跟踪文件）'],
      ['git log --oneline', '查看提交历史（精简）'],
      ['git diff', '查看未暂存的改动']
    ]],
    ['分支', [
      ['git branch', '列出本地分支'],
      ['git branch <名字>', '创建分支'],
      ['git checkout <分支>', '切换分支'],
      ['git checkout -b <名字>', '创建并切换分支'],
      ['git merge <分支>', '合并分支到当前'],
      ['git branch -d <名字>', '删除分支'],
      ['git branch -a', '列出所有分支（含远程）']
    ]],
    ['撤销/回退', [
      ['git restore <文件>', '丢弃工作区改动'],
      ['git restore --staged <文件>', '取消暂存'],
      ['git reset --hard HEAD~1', '回退上一个提交（丢弃改动）'],
      ['git reset --soft HEAD~1', '回退提交但保留改动'],
      ['git revert <commit>', '用新提交撤销指定提交'],
      ['git stash', '暂存当前改动'],
      ['git stash pop', '恢复暂存改动']
    ]],
    ['远程仓库', [
      ['git remote -v', '查看远程仓库'],
      ['git remote add origin <地址>', '添加远程仓库'],
      ['git push -u origin main', '首次推送并关联'],
      ['git push', '推送提交'],
      ['git pull', '拉取并合并'],
      ['git fetch', '拉取但不合并'],
      ['git push origin --delete <分支>', '删除远程分支']
    ]],
    ['标签/其他', [
      ['git tag', '列出标签'],
      ['git tag v1.0.0', '打标签'],
      ['git show <commit>', '查看提交详情'],
      ['git log --graph', '查看图形化提交历史'],
      ['git blame <文件>', '查看每行是谁改的'],
      ['git clean -fd', '删除未跟踪文件']
    ]]
  ];

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  GIT.forEach(function (group) {
    var block = document.createElement('div');
    block.style.cssText = 'margin-bottom:16px;';
    var title = document.createElement('div');
    title.style.cssText = 'font-weight:700;font-size:15px;margin-bottom:8px;color:var(--primary);';
    title.textContent = group[0];
    block.appendChild(title);
    group[1].forEach(function (item) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);';
      var code = document.createElement('code');
      code.textContent = item[0];
      code.style.cssText = 'flex:1;font-size:13px;white-space:nowrap;overflow-x:auto;';
      var desc = document.createElement('span');
      desc.textContent = item[1];
      desc.style.cssText = 'color:var(--muted);font-size:12px;min-width:150px;text-align:right;';
      var btn = document.createElement('button');
      btn.className = 'btn btn-secondary';
      btn.type = 'button';
      btn.textContent = '复制';
      btn.style.cssText = 'padding:4px 10px;font-size:12px;flex-shrink:0;';
      btn.addEventListener('click', function () {
        navigator.clipboard.writeText(item[0]).then(function () { showToast('命令已复制'); });
      });
      row.appendChild(code); row.appendChild(desc); row.appendChild(btn);
      block.appendChild(row);
    });
    gitResult.appendChild(block);
  });
})();
