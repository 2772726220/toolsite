<h2>倒计时有什么用？</h2><p>番茄工作法 25 分钟专注、烹饪定时、休息提醒、演讲限时，倒计时器到点提醒不用盯屏幕。</p><h2>怎么用？</h2><p>设置时长点击开始，剩余时间实时显示，到点自动提醒并响铃。</p>
    <h2>常见问题</h2>

<div class="toast" id="toast"></div>
<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var cdDisplay = document.getElementById('cdDisplay');
  var startBtn = document.getElementById('cdStartBtn');
  var pauseBtn = document.getElementById('cdPauseBtn');
  var resetBtn = document.getElementById('cdResetBtn');
  var minutesEl = document.getElementById('cdMinutes');
  var secondsEl = document.getElementById('cdSeconds');
  var remaining = 0;
  var timer = null;
  var paused = false;

  function render() {
    var m = Math.floor(remaining / 60);
    var s = remaining % 60;
    cdDisplay.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function beep() {
    try {
      var ctx = new AudioContext();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
      osc.start(); osc.stop(ctx.currentTime + 1);
    } catch (e) {}
  }

  startBtn.addEventListener('click', function () {
    if (timer) return;
    if (!paused) {
      var m = parseInt(minutesEl.value, 10) || 0;
      var s = parseInt(secondsEl.value, 10) || 0;
      remaining = m * 60 + s;
      if (remaining <= 0) { showToast('请设置时间'); return; }
    }
    paused = false;
    render();
    timer = setInterval(function () {
      remaining--;
      render();
      if (remaining <= 0) {
        clearInterval(timer); timer = null;
        paused = false;
        startBtn.textContent = '开始';
        pauseBtn.disabled = true;
        beep();
        showToast('时间到！');
      }
    }, 1000);
    startBtn.textContent = '进行中';
    startBtn.disabled = true;
    pauseBtn.disabled = false;
  });

  pauseBtn.addEventListener('click', function () {
    if (!timer) return;
    clearInterval(timer); timer = null;
    paused = true;
    startBtn.disabled = false;
    startBtn.textContent = '继续';
    pauseBtn.disabled = true;
  });

  resetBtn.addEventListener('click', function () {
    clearInterval(timer); timer = null;
    paused = false;
    remaining = 0;
    render();
    startBtn.disabled = false;
    startBtn.textContent = '开始';
    pauseBtn.disabled = true;
  });

  render();
})();
</script>
