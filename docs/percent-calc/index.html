<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var pcResult = document.getElementById('pcResult');

  document.getElementById('pcBtn').addEventListener('click', function () {
    var a = parseFloat(document.getElementById('pcA').value);
    var b = parseFloat(document.getElementById('pcB').value);
    var mode = document.getElementById('pcMode').value;
    if (isNaN(a) || isNaN(b)) { showToast('请输入有效数字'); return; }
    var res, text;
    if (mode === 'of') {
      res = a * b / 100;
      text = a + ' 的 ' + b + '% = <b>' + res + '</b>';
    } else if (mode === 'is') {
      if (b === 0) { showToast('Y 不能为 0'); return; }
      res = a / b * 100;
      text = a + ' 占 ' + b + ' 的 <b>' + res.toFixed(2) + '%</b>';
    } else {
      if (b === 0) { showToast('Y 不能为 0'); return; }
      res = (a - b) / b * 100;
      var dir = res > 0 ? '上涨' : (res < 0 ? '下跌' : '持平');
      text = '从 ' + b + ' 到 ' + a + '：<b>' + res.toFixed(2) + '%</b>（' + dir + '）';
    }
    pcResult.hidden = false;
    pcResult.innerHTML = text;
  });
  window.toggleTheme = function () {
    var r = document.documentElement;
    if (r.getAttribute('data-theme') === 'dark') { r.removeAttribute('data-theme'); try { localStorage.setItem('ts-theme', 'light'); } catch (e) {} }
    else { r.setAttribute('data-theme', 'dark'); try { localStorage.setItem('ts-theme', 'dark'); } catch (e) {} }
    updateThemeIcon();
  };
  function updateThemeIcon() {
    var b = document.getElementById('themeToggle');
    if (b) b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  var scrollTopBtn = document.getElementById('scrollTop');
  if (scrollTopBtn) {
    scrollTopBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    window.addEventListener('scroll', function () {
      scrollTopBtn.style.display = window.scrollY > 300 ? 'flex' : 'none';
    });
  }
  updateThemeIcon();
})();
</script>
