<h2>周岁怎么算？</h2><p>按公历生日计算，满一个整年算一岁，未过生日减一岁。</p><h2>能算距离生日还有几天吗？</h2><p>可以，同时显示今年生日已过/未过和下次生日倒计时。</p>

<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var acResult = document.getElementById('acResult');

  function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

  function diffYMD(birth, target) {
    var b = { y: birth.getFullYear(), m: birth.getMonth() + 1, d: birth.getDate() };
    var t = { y: target.getFullYear(), m: target.getMonth() + 1, d: target.getDate() };
    var years = t.y - b.y;
    var months = t.m - b.m;
    var days = t.d - b.d;
    if (days < 0) {
      months--;
      var prevMonth = t.m - 1;
      var prevMonthYear = t.y;
      if (prevMonth === 0) { prevMonth = 12; prevMonthYear--; }
      days += daysInMonth(prevMonthYear, prevMonth);
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    return { years: years, months: months, days: days };
  }

  document.getElementById('acBtn').addEventListener('click', function () {
    var birthV = document.getElementById('acBirth').value;
    var targetV = document.getElementById('acTarget').value;
    if (!birthV) { showToast('请选择出生日期'); return; }
    var birth = new Date(birthV + 'T00:00:00');
    var target = targetV ? new Date(targetV + 'T00:00:00') : new Date();
    target = new Date(target.getFullYear(), target.getMonth(), target.getDate());
    if (isNaN(birth) || isNaN(target)) { showToast('日期无效'); return; }
    if (birth > target) { showToast('出生日期不能晚于目标日期'); return; }
    var r = diffYMD(birth, target);
    var totalDays = Math.round((target - birth) / 86400000);
    var isBirthday = birth.getMonth() === target.getMonth() && birth.getDate() === target.getDate();
    var nextBirthday = new Date(target.getFullYear(), birth.getMonth(), birth.getDate());
    if (nextBirthday < target) nextBirthday = new Date(target.getFullYear() + 1, birth.getMonth(), birth.getDate());
    var daysToNext = Math.round((nextBirthday - target) / 86400000);
    acResult.hidden = false;
    acResult.innerHTML =
      '周岁年龄：<b style="font-size:24px;">' + r.years + '</b> 岁 ' + r.months + ' 个月 ' + r.days + ' 天<br>' +
      '总天数：' + totalDays + ' 天<br>' +
      (isBirthday ? '🎂 今天正好是生日！' : '距离下一个生日还有 ' + daysToNext + ' 天');
  });

  var today = new Date();
  document.getElementById('acBirth').value = '1990-01-01';
  document.getElementById('acTarget').value = today.toISOString().slice(0, 10);
  window.toggleTheme = function () {
    var r = document.documentElement;
    if (r.getAttribute('data-theme') === 'dark') { r.removeAttribute('data-theme'); try { localStorage.setItem('ts-theme', 'light'); } catch (e) {} }
    else { r.setAttribute('data-theme', 'dark'); try { localStorage.setItem('ts-theme', 'dark'); } catch (e) {} }
    updateThemeIcon();
  };
  function updateThemeIcon() {
    var b = document.getElementById('themeToggle');
    if (b) b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  var scrollTopBtn = document.getElementById('scrollTop');
  if (scrollTopBtn) {
    scrollTopBtn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    window.addEventListener('scroll', function () {
      scrollTopBtn.style.display = window.scrollY > 300 ? 'flex' : 'none';
    });
  }
  updateThemeIcon();
})();
</script>
