<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var zodiacResult = document.getElementById('zodiacResult');
  var ZODIACS = [
    { n: '水瓶座', s: [1, 20], e: [2, 18] }, { n: '双鱼座', s: [2, 19], e: [3, 20] },
    { n: '白羊座', s: [3, 21], e: [4, 19] }, { n: '金牛座', s: [4, 20], e: [5, 20] },
    { n: '双子座', s: [5, 21], e: [6, 21] }, { n: '巨蟹座', s: [6, 22], e: [7, 22] },
    { n: '狮子座', s: [7, 23], e: [8, 22] }, { n: '处女座', s: [8, 23], e: [9, 22] },
    { n: '天秤座', s: [9, 23], e: [10, 23] }, { n: '天蝎座', s: [10, 24], e: [11, 22] },
    { n: '射手座', s: [11, 23], e: [12, 21] }, { n: '摩羯座', s: [12, 22], e: [1, 19] }
  ];
  var ANIMALS = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];

  function getZodiac(m, d) {
    for (var i = 0; i < 12; i++) {
      var z = ZODIACS[i];
      if (z.s[0] === z.e[0]) { if (m === z.s[0] && d >= z.s[1]) return z.n; }
      else if (m === z.s[0] && d >= z.s[1]) return z.n;
      else if (m === z.e[0] && d <= z.e[1]) return z.n;
    }
    return '摩羯座';
  }

  document.getElementById('zodiacBtn').addEventListener('click', function () {
    var v = document.getElementById('zodiacDate').value;
    if (!v) { showToast('请选择日期'); return; }
    var parts = v.split('-');
    var y = +parts[0], m = +parts[1], d = +parts[2];
    if (y < 1900 || y > 2100) { showToast('支持 1900-2100 年'); return; }
    var zodiac = getZodiac(m, d);
    var animal = ANIMALS[((y - 4) % 12 + 12) % 12];
    var now = new Date();
    var age = now.getFullYear() - y - (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d) ? 1 : 0);
    zodiacResult.hidden = false;
    zodiacResult.innerHTML =
      '星座：<b style="font-size:22px;">' + zodiac + '</b><br>' +
      '生肖：<b>' + animal + '</b><br>' +

})();
