<h2>什么时候需要随机数？</h2><p>抽奖、摇号、随机分组、掷骰子、测试数据都需要随机数，设置范围即可生成。</p><h2>生成的随机数可靠吗？</h2><p>使用浏览器加密级随机数，每个结果独立且不可预测。</p>

<div class="toast" id="toast"></div>
<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var rnResult = document.getElementById('rnResult');

  document.getElementById('rnBtn').addEventListener('click', function () {
    var min = parseFloat(document.getElementById('rnMin').value);
    var max = parseFloat(document.getElementById('rnMax').value);
    var count = parseInt(document.getElementById('rnCount').value, 10);
    if (isNaN(min) || isNaN(max) || min > max) { showToast('请输入有效范围'); return; }
    if (isNaN(count) || count < 1 || count > 100) { showToast('个数需在 1-100 之间'); return; }
    var dec = document.getElementById('rnDec').checked;
    var unique = document.getElementById('rnUnique').checked;
    var out = [];
    var seen = {};
    var attempts = 0;
    while (out.length < count && attempts < 10000) {
      attempts++;
      var v;
      if (dec) v = min + Math.random() * (max - min);
      else v = Math.floor(Math.random() * (max - min + 1)) + min;
      if (unique) {
        var key = dec ? v.toFixed(4) : v;
        if (seen[key]) continue;
        seen[key] = 1;
      }
      out.push(dec ? +v.toFixed(4) : v);
    }
    rnResult.hidden = false;
    rnResult.textContent = out.join('、');
  });
})();
</script>
