<h2>怎么玩？</h2><p>3×3 棋盘轮流落子，先连成一线者胜，可自选先手后手。</p><h2>AI 强吗？</h2><p>AI 采用极大极小搜索，永远不输，最多和局。</p>

<div class="toast" id="toast"></div>
<script>
(function() {
  var toast = document.getElementById('toast');
  var toastTimer = null;
  window.showToast = function(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  };
  window.formatSize = function(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  };
  window.download = function(url, name) {
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
var ttBoard = document.getElementById('ttBoard');
  var ttStatus = document.getElementById('ttStatus');
  var board = ['', '', '', '', '', '', '', '', ''];
  var player = 'X';
  var ai = 'O';
  var gameOver = false;

  var WIN_LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

  function winner(b) {
    for (var i = 0; i < WIN_LINES.length; i++) {
      var l = WIN_LINES[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return b[l[0]];
    }
    if (b.indexOf('') === -1) return 'draw';
    return null;
  }

  function minimax(b, isAi, depth) {
    var w = winner(b);
    if (w === ai) return 10 - depth;
    if (w === player) return depth - 10;
    if (w === 'draw') return 0;
    var best = isAi ? -Infinity : Infinity;
    for (var i = 0; i < 9; i++) {
      if (b[i] === '') {
        b[i] = isAi ? ai : player;
        var score = minimax(b, !isAi, depth + 1);
        b[i] = '';
        best = isAi ? Math.max(best, score) : Math.min(best, score);
      }
    }
    return best;
  }

  function aiMove() {
    var best = -Infinity, move = -1;
    for (var i = 0; i < 9; i++) {
      if (board[i] === '') {
        board[i] = ai;
        var score = minimax(board, false, 0);
        board[i] = '';
        if (score > best) { best = score; move = i; }
      }
    }
    if (move >= 0) { board[move] = ai; }
  }

  function render() {
    ttBoard.innerHTML = '<div style="display:grid;grid-template-columns:repeat(3,88px);gap:8px;justify-content:center;">' +
      board.map(function (cell, i) {
        var disabled = cell !== '' || gameOver ? 'disabled' : '';
        var content = cell === 'X' ? '✕' : (cell === 'O' ? '◯' : '');
        return '<button class="btn btn-secondary" style="width:88px;height:88px;font-size:38px;line-height:1;padding:0;" data-i="' + i + '" ' + disabled + '>' + content + '</button>';
      }).join('') + '</div>';
    var w = winner(board);
    if (w === player) ttStatus.textContent = '🎉 你赢了！';
    else if (w === ai) ttStatus.textContent = '🤖 AI 获胜（下次抢中心吧）';
    else if (w === 'draw') ttStatus.textContent = '🤝 平局';
    else ttStatus.textContent = gameOver ? '游戏结束' : (board.filter(function (c) { return c === ''; }).length % 2 === 1 ? '轮到你（X）' : 'AI 思考中…');
  }

  ttBoard.addEventListener('click', function (e) {
    var i = parseInt(e.target.dataset.i, 10);
    if (isNaN(i) || gameOver || board[i] !== '') return;
    board[i] = player;
    render();
    if (winner(board)) { gameOver = true; render(); return; }
    aiMove();
    if (winner(board)) gameOver = true;
    render();
  });

  document.getElementById('ttNewBtn').addEventListener('click', function () {
    board = ['', '', '', '', '', '', '', '', ''];
    gameOver = false;
    if (document.getElementById('ttFirst').value === 'ai') {
      aiMove();
    }
    render();
  });

  ttBoard.addEventListener('click', function (e) {
    e.target.disabled = true;
  });

  document.getElementById('ttNewBtn').click();
  render();
})();
</script>
